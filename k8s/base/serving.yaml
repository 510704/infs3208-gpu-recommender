# Inference tier. No volumes: everything (catalogue, FPS curve, surrogate model)
# is read from the bucket named in APP-config, which is why the identical image
# runs against the emulator locally and real GCS on GKE.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: serving
spec:
  replicas: 2
  selector:
    matchLabels:
      app: serving
  strategy:
    rollingUpdate:
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: serving
    spec:
      serviceAccountName: serving
      containers:
        - name: serving
          image: gpu-recsys-serving:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: app-config
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          # Bootstrapping blocks the event loop while it reads the bucket; without
          # a startupProbe the liveness probe restarts it mid-boot.
          startupProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: serving
spec:
  selector:
    app: serving
  ports:
    - name: http
      port: 8000
      targetPort: 8000
