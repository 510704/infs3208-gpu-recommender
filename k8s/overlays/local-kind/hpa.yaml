# Dev-cluster only: scale the serving tier out between two and six replicas.
# GKE runs a single replica, so it deliberately has no HPA (see overlays/gke).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: serving
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: serving
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70