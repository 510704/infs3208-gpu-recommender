# Local cluster overlay (kind/minikube): swap real GCS for the emulator.
# The only functional differences from the GKE overlay are the emulator host
# below and the extra storage resources - that is the whole portability
# argument. MODEL_BUCKET and the blob names come from base/app-config.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gpu-recsys

resources:
  - ../../base
  - gcs.yaml
  - ingest-job.yaml
  - hpa.yaml
  - pdb.yaml

patches:
  - path: patch-app-config.yaml