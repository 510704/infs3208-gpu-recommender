# Expose the frontend on the node's external IP instead of a Cloud Load Balancer:
# the site is then reachable at http://<node-external-ip>:30080.
#
# scripts/deploy_gcp.sh opens tcp:30080 with a firewall rule and prints the URL.
# This removes the forwarding-rule + external-IP charge (~A$22/month).
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: NodePort
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080