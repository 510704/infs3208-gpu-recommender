# Google Kubernetes Engine overlay.
#
# PROJECT_ID and BUCKET_NAME are placeholders. scripts/deploy_gcp.sh copies this
# tree, rewrites them (and the image registry) from your .env or from
# PROJECT=/BUCKET= on the command line, and applies the rendered copy:
#   PROJECT=<id> BUCKET=<bucket> bash scripts/deploy_gcp.sh
# Applying this file directly would target the wrong project, so use the script.
#
# Differences from the local overlay are configuration only:
#   - real Cloud Storage (no STORAGE_EMULATOR_HOST) + Workload Identity
#   - images pulled from Artifact Registry
#   - one replica per tier and a single Spark worker to fit one small node
# Nothing in serving/app.py, frontend/ or the notebooks changes.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gpu-recsys

resources:
  - ../../base
  - pdb.yaml

components:
  - ../../components/training

images:
  - name: gpu-recsys-serving
    newName: australia-southeast1-docker.pkg.dev/PROJECT_ID/gpu-recsys/serving
    newTag: v1
  - name: gpu-recsys-frontend
    newName: australia-southeast1-docker.pkg.dev/PROJECT_ID/gpu-recsys/frontend
    newTag: v1
  - name: gpu-recsys-training
    newName: australia-southeast1-docker.pkg.dev/PROJECT_ID/gpu-recsys/training
    newTag: v1

patches:
  - path: patch-serviceaccounts.yaml
  - path: patch-app-config.yaml
  - path: patch-scale.yaml
  - path: patch-frontend-nodeport.yaml