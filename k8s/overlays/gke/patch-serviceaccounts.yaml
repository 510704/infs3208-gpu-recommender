# Workload Identity: bind each Kubernetes service account to a Google service
# account. The Google-side IAM bindings live in k8s/README.md (runbook).
#
# Only `serving` and `training` need identity: serving reads the bucket and the
# training job writes to it. The frontend is a static nginx proxy that never
# calls Google APIs, so it uses the namespace default account and has no binding.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: serving
  annotations:
    iam.gke.io/gcp-service-account: gpu-recsys-serving@PROJECT_ID.iam.gserviceaccount.com
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: training
  annotations:
    iam.gke.io/gcp-service-account: gpu-recsys-training@PROJECT_ID.iam.gserviceaccount.com