# Workload Identity: bind each Kubernetes service account to a Google service
# account. The Google-side IAM bindings live in k8s/README.md (runbook).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: serving
  annotations:
    iam.gke.io/gcp-service-account: gpu-recsys-serving@lucid-formula-504604-k8.iam.gserviceaccount.com
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: training
  annotations:
    iam.gke.io/gcp-service-account: gpu-recsys-training@lucid-formula-504604-k8.iam.gserviceaccount.com
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend
  annotations:
    iam.gke.io/gcp-service-account: gpu-recsys-frontend@lucid-formula-504604-k8.iam.gserviceaccount.com
